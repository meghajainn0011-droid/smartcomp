<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SmartComp cat test</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #ffffff; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #hint {
    position: fixed; left: 24px; top: 16px;
    font: 16px/1.4 system-ui, sans-serif; color: #8a94a6;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="hint">SmartComp draw test — drag to draw. Title should read "SmartComp cat test".</div>
<canvas id="c"></canvas>
<script>
  // Paint from real pointer events so anything drawn here proves the daemon's
  // XTEST drags actually reached the page, not just the window manager.
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  function size() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#1b1b1b';
    ctx.fillStyle = '#1b1b1b';
  }
  size();
  window.addEventListener('resize', size);
  let drawing = false;
  canvas.addEventListener('mousedown', (e) => {
    drawing = true;
    ctx.beginPath();
    ctx.moveTo(e.clientX, e.clientY);
    window.__start = [e.clientX, e.clientY];
  });
  canvas.addEventListener('mousemove', (e) => {
    if (!drawing) return;
    ctx.lineTo(e.clientX, e.clientY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(e.clientX, e.clientY);
  });
  canvas.addEventListener('mouseup', (e) => {
    if (!drawing) return;
    drawing = false;
    // A click with no travel still deserves a dot.
    if (window.__start && Math.hypot(e.clientX - window.__start[0], e.clientY - window.__start[1]) < 3) {
      ctx.beginPath();
      ctx.arc(e.clientX, e.clientY, 7, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.beginPath();
  });
</script>
</body>
</html>
